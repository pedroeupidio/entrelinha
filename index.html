const COLORS=['#ffca66','#74d8bb','#f48eac','#8db9ff','#d6a4ff','#ff9d72','#b7df76','#7cd8ed','#efb4d4','#b4a1ff'];
const ROOM='salas/sala-principal',MAX=10,WIDTH={1:25,2:15,3:10};
const $=id=>document.getElementById(id),rand=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let db,auth,uid='',mine='',epoch='',room={},chosen=0,busy=false,localLine=50,localGuess=50,localPoints=1,dragging='',seenRound='',unsub=null;
const players=()=>Object.entries(room.players||{}).filter(([k,p])=>p&&p.name).sort((a,b)=>a[1].position-b[1].position);
const ordered=()=>players().map(([k])=>k),active=()=>ordered().includes(mine),round=()=>room.game||null;
function msg(s){for(const id of ['entryMsg','lobbyMsg','gameMsg'])$(id).textContent=s||'';}
function color(pos){return COLORS[(pos-1)%COLORS.length]}
function show(id){for(const x of ['entry','lobby','game'])$(x).classList.toggle('hide',x!==id)}
function drawPositions(){const taken=new Set(players().map(([k,p])=>p.position));$('positions').replaceChildren();for(let i=1;i<=MAX;i++){const b=document.createElement('button');b.textContent=i;b.className=i===chosen?'active':'';b.disabled=taken.has(i)||busy;b.onclick=()=>{chosen=i;drawPositions()};$('positions').append(b)}}
function drawPeople(id,score=false){const host=$(id);host.replaceChildren();for(const [key,p] of players()){const el=document.createElement('div');el.className='player';const dot=document.createElement('span');dot.className='dot';dot.style.background=color(p.position);const name=document.createElement('span');name.textContent=`${p.position}. ${p.name}${key===mine?' (você)':''}`;el.append(dot,name);if(score){const s=document.createElement('span');s.className='score';s.textContent=(room.scores?.[key]||0)+' pts';el.append(s)}host.append(el)}}
function drawRuler(){const r=$('ruler');r.replaceChildren();for(let i=0;i<=10;i++){const t=document.createElement('div');t.className='tick'+(i%2===0?' major':'');if(i%2===0){const n=document.createElement('span');n.textContent=i/2+1;t.append(n)}r.append(t)}}
function freshGame(ids){const deck=Array.from({length:50},(_,i)=>i);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}return {stage:'line',round:1,host:ids[0],deck,deckIndex:0,theme:deck[0],line:null,guesses:{},revealed:false,finished:false,winIds:[],tie:false}}
function nextHost(ids,current){const ix=ids.indexOf(current);return ids[(ix+1+ids.length)%ids.length]}
function nextGuesser(g){return ordered().filter(k=>k!==g.host&&!g.guesses?.[k])[0]||null}
function guessBounds(value,points){const w=WIDTH[points];return {left:clamp(value-w/2,0,100-w),width:w}}
function scoreHit(line,guess){const b=guessBounds(guess.value,guess.points);return line>=b.left-0.00001&&line<=b.left+b.width+0.00001}
function drawGame(){const g=round();if(!g)return;const ids=ordered();const host=room.players?.[g.host];const myHost=mine===g.host;const current=g.stage==='guess'?nextGuesser(g):null;const myTurn=g.stage==='line'?myHost:g.stage==='guess'&&current===mine;const topic=THEMES[g.theme]||THEMES[0];$('round').textContent=`Rodada ${g.round}`;$('stage').textContent={line:'Linha secreta',guess:'Palpites',reveal:'Revelação',end:'Fim de jogo'}[g.stage]||g.stage;drawPeople('scoreboard',true);$('topicTitle').textContent=topic.title;$('levels').replaceChildren();topic.levels.forEach((txt,i)=>{const d=document.createElement('div');d.className='level';const b=document.createElement('b');b.textContent=i+1;const t=document.createElement('span');t.textContent=txt;d.append(b,t);$('levels').append(d)});
if(seenRound!==`${epoch}-${g.round}`){seenRound=`${epoch}-${g.round}`;localLine=50;localGuess=50;localPoints=1}
const board=$('board');board.classList.toggle('revealed',g.stage==='reveal'||g.stage==='end');const secret=$('secret');secret.classList.toggle('hide',g.stage!=='reveal'&&g.stage!=='end'&&!(myHost&&g.stage==='line'));secret.style.left=`${g.stage==='line'?localLine:g.line??50}%`;
const hostText=host?.name||'Jogador desconectado';let info='';if(g.stage==='line')info=myHost?'Arraste a linha vermelha no quadro branco e confirme. Sua posição ficará oculta para os demais.':`${hostText} está escolhendo sua posição secreta.`;if(g.stage==='guess')info=current===mine?'Sua vez! Escolha a ficha, arraste-a e confirme.':'Vez de '+(room.players?.[current]?.name||'jogador')+'. Palpites confirmados aparecem para todos.';if(g.stage==='reveal')info='A placa subiu! Confira quem acertou a linha.';if(g.stage==='end')info=g.tie?'Empate na liderança: seguimos para o desempate.':'Partida encerrada!';$('turnInfo').textContent=info;
$('curtain').classList.toggle('hide',g.stage==='line'&&myHost);$('choicesArea').classList.toggle('hide',!(g.stage==='guess'&&current===mine));document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',Number(b.dataset.points)===localPoints));
const tokens=$('tokens');tokens.replaceChildren();for(const [key,p] of players()){const saved=g.guesses?.[key];const provisional=g.stage==='guess'&&current===mine&&key===mine&&!saved;const guess=saved||(provisional?{points:localPoints,value:localGuess}:null);if(!guess)continue;const b=guessBounds(guess.value,guess.points);const el=document.createElement('div');el.className='token'+(provisional?' mine':'');el.style.left=b.left+'%';el.style.width=b.width+'%';el.style.bottom=((p.position-1)*10+1)+'%';el.style.background=color(p.position);el.textContent=guess.points;el.title=`${p.name}: ${guess.points} ponto(s)`;if(provisional){el.addEventListener('pointerdown',e=>{dragging='guess';el.setPointerCapture(e.pointerId);e.preventDefault()});el.addEventListener('pointermove',e=>{if(dragging==='guess')setFromPointer(e,'guess')});el.addEventListener('pointerup',()=>dragging='')}tokens.append(el)}
const action=$('action'),next=$('next');action.classList.toggle('hide',!myTurn);next.classList.toggle('hide',!(g.stage==='reveal'||g.stage==='end'));if(g.stage==='line')action.textContent='Confirmar linha secreta';else if(g.stage==='guess')action.textContent=`Confirmar ficha de ${localPoints} ponto(s)`;next.textContent=g.stage==='end'&&!g.tie?'Nova partida':'Próxima rodada';next.disabled=!(g.stage==='reveal'||g.stage==='end')||!(mine===g.host||!ids.includes(g.host));
const result=$('results');result.classList.toggle('hide',!(g.stage==='reveal'||g.stage==='end'));if(!result.classList.contains('hide')){result.replaceChildren();const h=document.createElement('h2');h.textContent=g.stage==='end'&&!g.tie?'🏆 Resultado final':g.tie?'⚖️ Desempate':'Resultado da rodada';result.append(h);for(const [key,p] of players()){if(key===g.host)continue;const guess=g.guesses?.[key];const d=document.createElement('div');d.className='result';d.textContent=`${p.name}: ${guess?(scoreHit(g.line,guess)?'✓ +'+guess.points+' ponto(s)':'✕ 0 pontos'):'Sem palpite'} · Total: ${room.scores?.[key]||0}`;result.append(d)}if(g.winIds?.length){const w=document.createElement('p');w.textContent='Vencedor(es): '+g.winIds.map(k=>room.players?.[k]?.name||'Jogador').join(', ');result.append(w)}}
}
function render(){drawPositions();if(!mine){show('entry');return}if(!room.players?.[mine]||room.epoch!==epoch){mine='';epoch='';sessionStorage.removeItem('entrelinhaSession');show('entry');msg('A sala foi reiniciada ou sua conexão anterior expirou. Entre novamente.');return}if(!room.game){show('lobby');drawPeople('lobbyPlayers');$('start').disabled=players().length<2||mine!==ordered()[0];return}show('game');drawGame()}
async function transact(update){if(!db)throw Error('Firebase não conectado.');const r=await runTransaction(ref(db,ROOM),old=>{if(!old||old.epoch!==epoch||!old.players?.[mine])return;return update(old)}, {applyLocally:false});if(!r.committed)throw Error('A sala mudou ou a ação não está mais disponível.');return r.snapshot.val()}
async function join(){if(busy)return;const name=$('name').value.trim();if(!name||!chosen)return msg('Informe seu nome e escolha uma posição.');busy=true;$('join').disabled=true;try{if(!uid)throw Error('Aguarde a autenticação.');const key=rand();const r=await runTransaction(ref(db,ROOM),old=>{old=old||{};if(!old.epoch)old.epoch=rand();if(old.game)return;old.players=old.players||{};if(Object.values(old.players).some(p=>p.position===chosen))return;old.players[key]={name,position:chosen,uid};old.scores=old.scores||{};old.scores[key]=0;return old},{applyLocally:false});if(!r.committed)throw Error('Posição ocupada ou partida já iniciada.');mine=key;epoch=r.snapshot.val().epoch;sessionStorage.setItem('entrelinhaSession',JSON.stringify({mine,epoch}));await onDisconnect(ref(db,`${ROOM}/players/${mine}`)).remove();msg('');render()}catch(e){msg(e.message)}finally{busy=false;$('join').disabled=false}}
async function reset(){if(!confirm('Reiniciar a sala para TODOS? A partida e os pontos serão apagados.'))return;try{if(!uid)throw Error('Firebase não conectado');await runTransaction(ref(db,ROOM),()=>({epoch:rand(),players:{},scores:{}}),{applyLocally:false});mine='';epoch='';sessionStorage.removeItem('entrelinhaSession');show('entry');msg('Sala reiniciada.')}catch(e){msg(e.message)}}
async function leave(){try{if(mine)await remove(ref(db,`${ROOM}/players/${mine}`))}catch(e){}mine='';epoch='';sessionStorage.removeItem('entrelinhaSession');show('entry')}
async function start(){try{await transact(old=>{if(old.game)return;const ids=Object.entries(old.players||{}).sort((a,b)=>a[1].position-b[1].position).map(([k])=>k);if(ids.length<2||ids[0]!==mine)return;old.game=freshGame(ids);return old})}catch(e){msg(e.message)}}
async function confirmAction(){const g=round();if(!g)return;try{if(g.stage==='line'){await transact(old=>{const a=old.game;if(a.stage!=='line'||a.host!==mine)return;a.line=Number(localLine.toFixed(3));a.stage='guess';return old})}else if(g.stage==='guess'){await transact(old=>{const a=old.game;if(a.stage!=='guess'||nextGuesserFrom(old)!==mine)return;a.guesses=a.guesses||{};a.guesses[mine]={points:localPoints,value:Number(localGuess.toFixed(3))};const ids=Object.keys(old.players||{}).filter(k=>k!==a.host);if(ids.every(k=>a.guesses[k])){a.stage='reveal';a.revealed=true;for(const [k,guess] of Object.entries(a.guesses)){if(scoreHit(a.line,guess))old.scores[k]=(old.scores[k]||0)+guess.points}const max=Math.max(...Object.values(old.scores||{}));const winners=Object.keys(old.scores||{}).filter(k=>old.players?.[k]&&old.scores[k]===max);if(max>=20){a.stage='end';a.winIds=winners;a.tie=winners.length>1}}return old})}}catch(e){msg(e.message)}}
function nextGuesserFrom(old){const a=old.game;return Object.entries(old.players||{}).sort((x,y)=>x[1].position-y[1].position).map(([k])=>k).find(k=>k!==a.host&&!a.guesses?.[k])||null}
async function advance(){try{await transact(old=>{const a=old.game;if(!['reveal','end'].includes(a.stage))return;if(mine!==a.host&&old.players?.[a.host])return;const ids=Object.entries(old.players||{}).sort((x,y)=>x[1].position-y[1].position).map(([k])=>k);if(ids.length<2)return;if(a.stage==='end'&&!a.tie){old.scores=Object.fromEntries(ids.map(k=>[k,0]));old.game=freshGame(ids);return old}let nextIndex=a.deckIndex+1;if(nextIndex>=a.deck.length){a.deck=Array.from({length:50},(_,i)=>i).sort(()=>Math.random()-.5);nextIndex=0}a.deckIndex=nextIndex;a.theme=a.deck[nextIndex];a.host=nextHost(ids,a.host);a.round++;a.stage='line';a.line=null;a.guesses={};a.winIds=[];a.tie=false;return old})}catch(e){msg(e.message)}}
function setFromPointer(e,type){const r=$('board').getBoundingClientRect();const x=clamp((e.clientX-r.left)/r.width*100,0,100);if(type==='line')localLine=x;else localGuess=clamp(x,WIDTH[localPoints]/2,100-WIDTH[localPoints]/2);drawGame()}
$('board').addEventListener('pointerdown',e=>{const g=round();if(!g)return;if(g.stage==='line'&&mine===g.host){dragging='line';$('board').setPointerCapture(e.pointerId);setFromPointer(e,'line')}else if(g.stage==='guess'&&nextGuesser(g)===mine){dragging='guess';$('board').setPointerCapture(e.pointerId);setFromPointer(e,'guess')}});
$('board').addEventListener('pointermove',e=>{if(dragging)setFromPointer(e,dragging)});$('board').addEventListener('pointerup',()=>dragging='');$('board').addEventListener('pointercancel',()=>dragging='');
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{localPoints=Number(b.dataset.points);localGuess=clamp(localGuess,WIDTH[localPoints]/2,100-WIDTH[localPoints]/2);drawGame()});
$('join').onclick=join;$('resetEntry').onclick=reset;$('resetLobby').onclick=reset;$('restart').onclick=reset;$('leave').onclick=leave;$('start').onclick=start;$('action').onclick=confirmAction;$('next').onclick=advance;drawRuler();drawPositions();
(async()=>{try{if(Object.values(firebaseConfig).some(v=>String(v).startsWith('COLE_')))throw Error('Configure firebaseConfig no HTML antes de publicar.');const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);const credential=await signInAnonymously(auth);uid=credential.user.uid;$('connection').textContent='● Conectado';const saved=JSON.parse(sessionStorage.getItem('entrelinhaSession')||'null');if(saved){mine=saved.mine;epoch=saved.epoch}unsub=onValue(ref(db,ROOM),snap=>{room=snap.val()||{};render()},e=>{msg('Erro ao ler a sala: '+e.message);$('connection').textContent='● Erro'});}catch(e){$('connection').textContent='● Erro';msg(e.message)}})();
</script></body></html>
